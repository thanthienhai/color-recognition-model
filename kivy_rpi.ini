[kivy]
# Kivy configuration for Raspberry Pi

# Window provider
window = sdl2

# Graphics provider
graphics = gles

# Input provider
input = probesysfs,mtdev,linuxwacom,hidinput

# Log level
log_level = info

# Max FPS
maxfps = 30

# Desktop (set to 0 for fullscreen-like behavior)
desktop = 0

# Window size (comment out for auto-detect)
# width = 800
# height = 480

# Fullscreen (let the app handle this)
# fullscreen = 0

# Borderless window
borderless = 1

# SDL2 specific settings
[sdl2]
# Video driver for Raspberry Pi
videodriver = rpi

# Framebuffer device
fbdev = /dev/fb0

# Disable vsync to avoid issues
vsync = 0

# Force GLES
gles = 1
